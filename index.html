<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MetroMate - Delhi Metro Route Finder</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="app">


    <div class="top">

        <div class="metro-icon">
            🚇
        </div>

        <div>

            <h1>MetroMate</h1>

            <p>Delhi Metro Route Intelligence</p>

        </div>

    </div>



    <div class="main-card">


        <h2>
            Plan Your Journey
        </h2>



        <div class="inputs">


            <div class="input-card">

                <span>🟢 FROM</span>

                <select id="source">

                    <option value="">
                        Select Source Station
                    </option>

                </select>

            </div>



            <button class="swap" onclick="swapStations()">
                ⇅
            </button>



            <div class="input-card">

                <span>🔴 TO</span>

                <select id="destination">

                    <option value="">
                        Select Destination Station
                    </option>

                </select>

            </div>


        </div>




        <button class="search" onclick="findRoute()">

            🔍 Find Route

        </button>



    </div>



    <div id="output"></div>



</div>



<script src="index.js"></script>


</body>

</html>
